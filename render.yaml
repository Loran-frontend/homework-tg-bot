services:
  - type: web
    name: homework-tg-bot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_SECRET
        sync: false
